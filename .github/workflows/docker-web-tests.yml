name: Docker + Helm CI/CD

on:
  push:
    branches: [ feature/k8s-helm ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.drpahan }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          tags: ${{ secrets.drpahan }}/test-repo-app:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ secrets.drpahan }}/test-repo-web:latest

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Package Helm Chart
        run: helm package helm/test-repo-chart

      - name: Upload Helm Chart to Release
        uses: softprops/action-gh-release@v1
        with:
          files: test-repo-chart-*.tgz
          tag_name: helm-chart